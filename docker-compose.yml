services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-okore}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  mocks:
    build: .
    command: uvicorn okore_agent.mock_services:app --host 0.0.0.0 --port 8001
    environment:
      BACKEND_DB_URL: postgresql://backend_rw:backend_rw@postgres:5432/${POSTGRES_DB:-okore}
      FAULT_WORKSHOPS: ${FAULT_WORKSHOPS:-}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  # Interactive CLI, not a daemon: docker compose run --rm agent --user luis
  agent:
    build: .
    profiles: ["cli"]
    entrypoint: ["python", "-m", "okore_agent.cli"]
    stdin_open: true
    tty: true
    environment:
      MOCKS_URL: http://mocks:8001
      AGENT_DB_URL: postgresql://agent_ro:agent_ro@postgres:5432/${POSTGRES_DB:-okore}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      # The model server runs on the host (e.g. Ollama on :11434), not in this compose.
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:14b}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TRACE_PATH: /app/logs/agent_runs.jsonl
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mocks:
        condition: service_started

volumes:
  pgdata:
