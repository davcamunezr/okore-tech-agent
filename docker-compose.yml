services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-okore}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  mocks:
    build: .
    command: uvicorn okore_agent.mock_services:app --host 0.0.0.0 --port 8001
    environment:
      BACKEND_DB_URL: postgresql://backend_rw:backend_rw@postgres:5432/${POSTGRES_DB:-okore}
      FAULT_WORKSHOPS: ${FAULT_WORKSHOPS:-}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
